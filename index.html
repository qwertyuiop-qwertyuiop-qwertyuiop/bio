<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            background: linear-gradient(135deg, #16121e 0%, #111218 100%);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0px 0px 60px rgba(88, 58, 255, 0.08);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .avatar-placeholder {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #22252a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-titles h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            min-height: 34px;
        }

        .tags-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 22px;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.06);
            color: #8a8d93;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .about-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #525660;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .about-text {
            color: #b5babf;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            transition: transform 0.2s ease, background-color 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .link-item:hover {
            transform: translateX(4px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-discord { background-color: rgba(88, 101, 242, 0.15); color: #5865F2; }
        .link-discord:hover { background-color: rgba(88, 101, 242, 0.25); }

        .arrow {
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <div class="profile-header">
            <div class="avatar-placeholder" id="user-avatar-box">
                <svg width="32" height="32" fill="#4e535e" viewBox="0 0 16 16"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
            </div>
            <div class="user-titles">
                <h1 id="user-name"></h1>
                <div class="tags-container" id="user-tags">
                    <!-- Dynamic user sub-tags will load here later -->
                </div>
            </div>
        </div>

        <div class="about-section">
            <div class="section-title">About Me</div>
            <p class="about-text" id="user-about">
                Hello, i'm from america. I have experience with Luau and Python, To contact me, click the discord button under this message
            </p>
        </div>

        <div class="links-list">
            <!-- Replace the # with your actual Discord profile invite link -->
            <a href="#" class="link-item link-discord" id="btn-discord">
                <div class="link-content">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.202 12.202 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032a.054.054 0 0 0 .022.037c2.1 1.548 4.14 2.49 6.14 3.11a.05.05 0 0 0 .054-.018c.472-.645.892-1.336 1.252-2.066a.051.051 0 0 0-.028-.07 8.684 8.684 0 0 1-1.21-.578.051.051 0 0 1-.006-.084c.085-.063.17-.129.252-.197a.05.05 0 0 1 .053-.007c4.028 1.84 8.396 1.84 12.384 0a.05.05 0 0 1 .053.007c.083.068.168.134.253.197a.051.051 0 0 1-.006.084 7.673 7.673 0 0 1-1.21.578.05.05 0 0 0-.028.07c.36.73.78 1.421 1.252 2.066a.05.05 0 0 0 .054.018c2.01-.62 4.05-1.562 6.14-3.11a.054.054 0 0 0 .022-.037c.325-3.406-.532-6.411-2.298-9.107a.041.041 0 0 0-.021-.018zM5.08 10.17c-.765 0-1.397-.702-1.397-1.563s.614-1.563 1.397-1.563c.784 0 1.407.702 1.407 1.563s-.614 1.563-1.407 1.563zm5.84 0c-.765 0-1.397-.702-1.397-1.563s.614-1.563 1.397-1.563c.783 0 1.407.702 1.407 1.563s-.614 1.563-1.407 1.563z"/></svg>
                    <span>My Discord Account</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

    </div>

</body>
</html>
