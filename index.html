<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi !</title>
    <style>
        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            background-color: #f7f7f7 !important;
            color: #1a1a1a !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            min-height: 100vh !important;
            width: 100vw !important;
            display: grid !important;
            place-items: center !important; /* Forces the entire card right into the middle of the screen */
        }

        /* Strict block container wrapper to prevent any horizontal expansion */
        .profile-card {
            background-color: #ffffff !important;
            width: 90% !important;
            max-width: 380px !important; /* Locked explicit desktop width */
            padding: 32px !important;
            border-radius: 20px !important;
            border: 1px solid #e1e1e1 !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02) !important;
            
            /* Strict vertical grid blueprint */
            display: grid !important;
            grid-template-columns: 100% !important;
            row-gap: 20px !important; /* Enforces absolute gaps between vertically stacked blocks */
            justify-items: center !important;
        }

        .avatar {
            width: 90px !important;
            height: 90px !important;
            border-radius: 16px !important;
            object-fit: cover !important;
            border: 1px solid #eaeaea !important;
            display: block !important;
        }

        .identity-block {
            text-align: center !important;
            width: 100% !important;
        }

        .identity-block h1 {
            font-size: 1.8rem !important;
            font-weight: 800 !important;
            color: #111111 !important;
            letter-spacing: -0.5px !important;
            margin-bottom: 4px !important;
        }

        .identity-block .handle {
            font-size: 0.95rem !important;
            color: #666666 !important;
            font-family: monospace !important;
            display: block !important;
        }

        .bio-block {
            text-align: center !important;
            width: 100% !important;
        }

        .bio-text {
            font-size: 0.95rem !important;
            line-height: 1.6 !important;
            color: #2b2b2b !important;
            margin-bottom: 16px !important;
            display: block !important;
        }

        .skills-row {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            gap: 8px !important;
            width: 100% !important;
        }

        .skill-tag {
            font-family: monospace !important;
            font-size: 0.8rem !important;
            color: #444444 !important;
            background-color: #f5f5f5 !important;
            padding: 4px 12px !important;
            border-radius: 6px !important;
            border: 1px solid #e8e8e8 !important;
        }

        /* Isolated structural block button link */
        .discord-btn {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            background-color: #111111 !important;
            color: #ffffff !important;
            text-decoration: none !important;
            width: 100% !important;
            height: 50px !important; /* Absolute height lock */
            border-radius: 12px !important;
            font-size: 0.95rem !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 0px #333333 !important;
            transition: transform 0.1s ease, box-shadow 0.1s ease !important;
        }

        .discord-btn:hover {
            transform: translateY(2px) !important;
            box-shadow: 0 2px 0px #333333 !important;
        }

        .discord-btn:active {
            transform: translateY(4px) !important;
            box-shadow: 0 0px 0px #333333 !important;
        }

        .discord-icon {
            width: 20px !important;
            height: 20px !important;
            fill: #ffffff !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <!-- Strict vertical layout grid container -->
    <div class="profile-card">
        
        <!-- Block 1: Profile Image -->
        <img class="avatar" src="https://discordapp.com" alt="Lumi">

        
        
            <h1>Lumi !</h1>
            <span class="handle">@arozely</span>
        </div>

        <!-- Block 3: Biography Content & Tags -->
        <div class="bio-block">
            <span class="bio-text">
                Hello, i'm from america. I have experience with Luau and Python, To contact me, click the discord button under this message
            </span>
            <div class="skills-row">
                <span class="skill-tag">luau</span>
                <span class="skill-tag">python</span>
            </div>
        </div>

        <!-- Block 4: Fixed Action Button -->
        <a class="discord-btn" href="https://discord.com" target="_blank">
            <svg class="discord-icon" viewBox="0 0 127.14 96.36">

            </svg>
            Connect on Discord
        </a>
        
    </div>

</body>
</html>
