<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi !</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfcfc;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Fixed central vertical column wrapping block */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            text-align: center; /* Centers all content blocks perfectly */
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid #eaeaea;
            margin: 0 auto 20px auto;
            display: block;
        }

        .identity h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #111111;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .identity .handle {
            font-size: 0.95rem;
            color: #666666;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: block;
            margin-bottom: 24px;
        }

        .bio-section {
            margin-bottom: 28px;
        }

        .bio-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2b2b2b;
            margin-bottom: 16px;
        }

        .skills-container {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .skill-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            color: #444444;
            background-color: #f5f5f5;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #e8e8e8;
            text-transform: lowercase;
        }

        /* Solid block minimalist button link */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0px #333333;
            margin-top: 10px;
        }

        .discord-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #333333;
        }

        .discord-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #333333;
        }

        .discord-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
    </style>
</head>

    <div class="profile-card">
