<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi !</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f7f7;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* Clean, structural minimalist card container */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #e1e1e1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 12px; /* Smooth square corner layout */
            object-fit: cover;
            border: 1px solid #eaeaea;
        }

        /* Tiny custom badge indicator */
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #2da44e;
            background-color: #dafbe1;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #2da44e;
            border-radius: 50%;
        }

        .identity {
            margin-bottom: 20px;
        }

        .identity h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        .identity .handle {
            font-size: 0.95rem;
            color: #6e6e6e;
            font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
        }

        .bio-section {
            margin-bottom: 28px;
        }

        .bio-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333333;
        }

        .skills-container {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .skill-tag {
            font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            color: #444444;
            background-color: #f1f1f1;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
        }

        /* Custom structural button with a stark offset drop-shadow */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0px #333333;
        }

        .discord-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #333333;
        }

        .discord-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #333333;
        }

        .discord-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <img class="avatar" src="https://cdn.discordapp.com/avatars/1469757489070211167/62df0ef921af061a69bbdc253c7c43f3.webp?size=2048" alt="Lumi">
            <div class="badge">
                <span class="badge-dot"></span> Active
            </div>
        </div>

        
            <h1>Lumi !</h1>
            <span class="handle">@arozely</span>
        </div>

        <div class="bio-section">
            <p class="bio-text">
                Hello, i'm from america. I have experience with Luau and Python. To contact me, click the discord button under this message.
            </p>
            <div class="skills-container">
                <span class="skill-tag">luau</span>
                <span class="tag skill-tag">python</span>
            </div>
        </div>

        <a class="discord-btn" href="https://discord.com/users/1469757489070211167" target="_blank">

            </svg>
            Connect on Discord
        </a>
    </div>

</body>
</html>
